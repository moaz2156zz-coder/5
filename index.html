<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة ❤️</title>
    <link rel="stylesheet" href="password.css">
</head>

<body>

    <div id="hearts"></div>

    <main class="login-card">

        <div class="lock">🔐</div>

        <p class="small">A Little Surprise For You</p>

        <h1>قول كلمة السر 🙈</h1>

        <p class="hint">
            الباسورد يا مظة 😘
        </p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="كلمة السر"
                inputmode="numeric"
            >

            <button id="showPassword">👁️</button>

        </div>

        <button id="enterBtn">
            ✨ افتحي الهدية
        </button>

        <p id="error"></p>

        <div class="bottom">
            Made with ❤️ مخصوص لجنجونتي
        </div>

    </main>

    <script src="password.js"></script>

</body>
</html>
