<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>آلة الزمن ❤️</title>

    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- النجوم -->
    <div id="stars"></div>

    <!-- الإضاءة -->
    <div class="ambient-light"></div>

    <main class="time-page">

        <div class="time-badge">
            ✦
        </div>

        <span class="mini-title">
            A MOMENT IN TIME
        </span>

        <h1>
            آلة الزمن
        </h1>

        <p class="intro">
            لو كان ممكن نرجع بالوقت...
            <br>
            يا ترى هنختار نعيش أنهي لحظة تاني؟ ❤️
        </p>


        <!-- الساعة -->
        <div class="time-machine">

            <div class="orbit orbit-1"></div>
            <div class="orbit orbit-2"></div>
            <div class="orbit orbit-3"></div>

            <div class="clock">

                <div class="clock-inner">
                    <span id="clockSymbol">✦</span>
                </div>

            </div>

        </div>


        <!-- العد التنازلي -->

        <div class="countdown">

            <span id="counter">
                03
            </span>

        </div>


        <button
            id="startTime"
            class="time-button"
        >
            ارجعي الزمن ✨
        </button>


        <!-- الذكريات -->

        <section
            id="memoryBox"
            class="memory-box"
        >

            <div class="memory-line"></div>

            <span class="memory-number">
                MEMORY <b id="memoryNumber">01</b>
            </span>

            <h2 id="memoryTitle">
                لحظة...
            </h2>

            <p id="memoryText">
                الزمن لسه بيبدأ ❤️
            </p>

            <div class="memory-symbol">
                ∞
            </div>

        </section>


        <button
            id="nextPageBtn"
            class="next-page-button"
        >
                <span class="btn-text">كملي يا مظة</span>
            <span class="btn-icon">→</span>
        </button>



    </main>


    <script src="gallery.js"></script>

</body>
</html>
