<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عيد ميلاد جنجونتي ❤️</title>

    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- قلوب الخلفية -->
    <div class="hearts"></div>

    <!-- اللمعات -->
    <div class="sparkles"></div>

    <main class="birthday-page">

        <div class="top-heart">♥</div>

        <p class="small-title">إلى أجمل شخص في حياتي</p>

        <h1 class="title">
            عيد ميلاد
            <span>جنجونتي</span>
        </h1>

        <div class="line"></div>

        <!-- النص المتحرك -->
        <div class="message-box">

            <div class="heart-icon">♡</div>

            <p id="typingText"></p>

        </div>

        <div class="love-text">
            كل سنة وانتي أجمل حاجة في حياتي ❤️
        </div>

        <!-- زر الانتقال -->
        <button class="next-btn" onclick="goNext()">
            <span>كمّلي معايا</span>
            <b>❤️</b>
        </button>

        <p class="hint">اضغطي هنا عشان نكمل الحكاية ✨</p>

    </main>

    <!-- شاشة الانتقال -->
    <div class="transition-screen">
        <div class="transition-heart">❤️</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
